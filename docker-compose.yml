# OpenMessage as a headless server with persistent storage.
#
# Usage:
#     docker compose up -d
#     docker compose exec openmessage openmessage pair --google    # one-time
#     # re-pairing later: docker compose stop, then
#     #   docker compose run --rm openmessage pair --google, then up -d
#     # then connect Claude / other MCP clients to http://localhost:7007/mcp/sse

services:
  openmessage:
    build: .
    image: openmessage:latest
    container_name: openmessage
    restart: unless-stopped
    ports:
      - "7007:7007"
    volumes:
      - openmessage-data:/data
    environment:
      OPENMESSAGES_DATA_DIR: /data
      OPENMESSAGES_HOST: 0.0.0.0
      OPENMESSAGES_PORT: "7007"
      # Uncomment to send anonymous heartbeats (off by default). Only "1"
      # enables them; note the singular OPENMESSAGE_ prefix. The install ID
      # lives in the /data volume, so it survives container restarts.
      # OPENMESSAGE_TELEMETRY: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7007/api/status >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  openmessage-data:
