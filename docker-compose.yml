# OpenMessage as a headless server with persistent storage.
#
# Usage:
#     docker compose up -d
#     docker compose exec openmessage openmessage pair    # one-time
#     # re-pairing later: docker compose stop, then
#     #   docker compose run --rm openmessage pair, then up -d
#
# Every API and MCP request needs the control token, which the server keeps
# in /data/control.token:
#     docker compose exec openmessage cat /data/control.token
# Send it as "Authorization: Bearer <token>". For the web UI, open the
# single-use link in `docker compose logs openmessage` (look for
# /auth/bootstrap), or paste the token into the page.
#
# The port is published on the host's loopback only. Publishing it on all
# interfaces ("7007:7007") puts a messaging hub that can send as you on your
# network; reach it remotely through an SSH tunnel instead.

services:
  openmessage:
    build: .
    image: openmessage:latest
    container_name: openmessage
    restart: unless-stopped
    ports:
      - "127.0.0.1:7007:7007"
    volumes:
      - openmessage-data:/data
    environment:
      OPENMESSAGES_DATA_DIR: /data
      # Inside the container the server must bind all interfaces for Docker's
      # port forward to reach it; the ports entry above keeps that forward on
      # the host's loopback.
      OPENMESSAGES_HOST: 0.0.0.0
      OPENMESSAGES_PORT: "7007"
      # Set to "1" to send anonymous heartbeats (off by default).
      # OPENMESSAGE_TELEMETRY_ENABLED: "0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7007/healthz >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  openmessage-data:
