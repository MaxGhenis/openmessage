name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-cross-platform:
    name: Build CLI binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="$RELEASE_TAG"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o dist/openmessage .
          tar -C dist -czf "openmessage-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" openmessage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmessage-${{ matrix.goos }}-${{ matrix.goarch }}
          path: openmessage-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          retention-days: 7

  build-macos-app:
    name: Build macOS .app + .dmg
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Import the Developer ID Application certificate into a temporary
      # keychain so codesign can find it. Skipped when secrets are unset
      # (build will fall back to ad-hoc signing).
      - name: Import code signing certificate
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # Decode the .p12 from the base64 secret
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          # Create a fresh keychain just for this run
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make the new keychain the default search target so codesign sees it
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Import the cert and authorize codesign to use it without prompting
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify the identity is now visible
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Clean up the decoded .p12 immediately
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build macOS app + DMG
        env:
          # RELEASE=1 is required: without it build.sh deliberately stamps the
          # dev bundle id (com.openmessage.app.dev) and emits OpenMessage-dev.dmg,
          # so a stale dev build can never shadow the installed app in
          # LaunchServices. Shipping artifacts must carry the real id.
          RELEASE: "1"
          VERSION: ${{ env.RELEASE_TAG }}
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
        run: bash macos/build.sh

      - name: Verify release bundle identity
        run: |
          plist=macos/build/OpenMessage.app/Contents/Info.plist
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")
          echo "Built bundle id: $id, name: $name"
          if [ "$id" != "com.openmessage.app" ] || [ "$name" != "OpenMessage" ]; then
            echo "::error::Release build has id '$id' / name '$name', expected com.openmessage.app / OpenMessage."
            echo "::error::RELEASE=1 was not honored — refusing to ship a dev-identity build."
            exit 1
          fi
          test -f macos/build/OpenMessage.dmg || {
            echo "::error::macos/build/OpenMessage.dmg missing (dev builds emit OpenMessage-dev.dmg)."
            exit 1
          }

      - name: Verify notarization
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
        run: |
          spctl --assess --type install --verbose macos/build/OpenMessage.dmg || {
            echo "::warning::DMG did not pass Gatekeeper assessment"
            exit 0
          }

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMessage-app
          path: macos/build/OpenMessage.app
          retention-days: 7

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMessage-dmg
          path: macos/build/OpenMessage.dmg
          retention-days: 7

  publish-container:
    name: Publish container image
    needs: [build-cross-platform, build-macos-app]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          context: git
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_TAG, '-') }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Build and push container image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    needs: [build-cross-platform, build-macos-app, publish-container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CONTAINER_IMAGE: ${{ needs.publish-container.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "!*.dockerbuild"
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          cp artifacts/openmessage-darwin-arm64/openmessage-darwin-arm64.tar.gz release/
          cp artifacts/openmessage-darwin-amd64/openmessage-darwin-amd64.tar.gz release/
          cp artifacts/openmessage-linux-arm64/openmessage-linux-arm64.tar.gz release/
          cp artifacts/openmessage-linux-amd64/openmessage-linux-amd64.tar.gz release/
          cp artifacts/OpenMessage-dmg/OpenMessage.dmg release/

          # Generate SHA256 checksums for verification + Homebrew updates
          (cd release && shasum -a 256 * > SHA256SUMS)

      - name: Generate release notes
        id: notes
        run: |
          tag="$RELEASE_TAG"
          previous=$(git tag --merged "$tag" --sort=-v:refname | awk -v tag="$tag" '$0 != tag && !found {print; found=1}')
          if [ -z "$previous" ]; then
            git log --pretty=format:"- %s (%h)" > NOTES.md
          else
            git log "${previous}..${tag}" --pretty=format:"- %s (%h)" > NOTES.md
          fi
          printf '\n\n## Container image\n\n`docker pull %s:%s`\n' "$CONTAINER_IMAGE" "$tag" >> NOTES.md
          echo "Generated notes from ${previous:-beginning} to ${tag}"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --notes-file NOTES.md
          else
            gh release create "$tag" \
              --title "OpenMessage ${tag}" \
              --notes-file NOTES.md \
              release/*
          fi
