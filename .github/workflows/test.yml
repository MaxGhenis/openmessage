name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GO_COVERAGE_MIN: "40.0"

jobs:
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go test suite with coverage
        run: go test ./... -coverprofile=coverage.out

      - name: Summarize Go coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(awk '/^total:/ {gsub("%", "", $NF); print $NF}' coverage.txt)
          echo "total=${total}" >> "$GITHUB_OUTPUT"
        id: coverage

      - name: Enforce Go coverage floor
        run: |
          awk -v total="${{ steps.coverage.outputs.total }}" -v min="${GO_COVERAGE_MIN}" 'BEGIN { exit !(total + 0 >= min + 0) }'

      - name: Upload Go coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.txt

  go-race:
    name: Go Race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go race suite
        run: go test -race ./...

  e2e:
    name: Web E2E
    # ubuntu-latest moved to 26.04, where Playwright 1.58 refuses to install
    # Chromium ("does not support chromium on ubuntu26.04-x64"). Move back to
    # ubuntu-latest once the pinned Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/

  site-build:
    name: Site Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Build marketing site
        run: npm run build

  container:
    name: Container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENMESSAGE_IMAGE: openmessage:test
      COMPOSE_PROJECT_NAME: openmessage-container-test
    steps:
      - uses: actions/checkout@v4

      - name: Build container
        run: |
          docker compose config --quiet
          docker compose build --build-arg VERSION=container-test

      - name: Verify runtime and Compose health check
        run: |
          set -eu
          docker compose run --detach --pull never --service-ports --name openmessage \
            openmessage serve --web --mcp-sse
          for _ in $(seq 1 90); do
            health="$(docker inspect --format='{{.State.Health.Status}}' openmessage)"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$health" = unhealthy ]; then
              docker logs openmessage
              exit 1
            fi
            sleep 1
          done
          test "$health" = healthy
          docker compose port openmessage 7007 | grep -Fx '127.0.0.1:7007'
          docker exec -i openmessage sh -es <<'SH'
          test "$(id -u):$(id -g)" = "100:101"
          test "$HOME" = "/home/openmessage"
          command -v apk
          touch /data/.container-smoke
          rm /data/.container-smoke
          test -s /etc/ssl/certs/ca-certificates.crt
          test -s /usr/share/zoneinfo/America/New_York
          test "$(TZ=America/New_York date -d @0 +%z)" = "-0500"
          wget -qO- \
            --header='Content-Type: application/json' \
            --header='Accept: application/json, text/event-stream' \
            --post-data='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"container-smoke","version":"1"}}}' \
            http://127.0.0.1:7007/mcp | grep -q '"version":"container-test"'
          SH

      - name: Show container logs on failure
        if: failure()
        run: docker logs openmessage || docker compose logs

      - name: Clean up
        if: always()
        run: |
          docker rm --force openmessage || true
          docker compose down --volumes

  macos-build:
    name: macOS App Build
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Guard against the stale root Xcode tree
        run: |
          if [ -e OpenMessage/OpenMessage.xcodeproj ] || [ -e OpenMessage/Info.plist ]; then
            echo "::error::The stale root OpenMessage/ tree is back. The app is built from the SwiftPM package at macos/OpenMessage; delete the root OpenMessage/ directory."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Swift package
        run: swift build --package-path macos/OpenMessage

      - name: Build Go backend for Swift smoke
        run: GOWORK=off go build -o "$RUNNER_TEMP/openmessage" .

      - name: Test Swift package
        env:
          OPENMESSAGE_BINARY: ${{ runner.temp }}/openmessage
        run: swift test --package-path macos/OpenMessage

      - name: Package macOS app
        run: bash macos/build.sh

      - name: Verify dev build cannot shadow the installed app
        run: |
          # A default (non-RELEASE) build must NOT claim com.openmessage.app —
          # that id collision let stale builds win LaunchServices resolution and
          # caused two live outages. See docs/agent-runbook.md "Bundle-id shadowing".
          # The NAME must differ too: `open -a OpenMessage` resolves by the
          # registered name (CFBundleName/CFBundleDisplayName), not the id.
          plist=macos/build/OpenMessage.app/Contents/Info.plist
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")
          echo "Dev build bundle id: $id, name: $name"
          if [ "$id" != "com.openmessage.app.dev" ]; then
            echo "::error::Default build has bundle id '$id', expected com.openmessage.app.dev."
            exit 1
          fi
          if [ "$name" != "OpenMessage (dev)" ]; then
            echo "::error::Default build has CFBundleName '$name', expected 'OpenMessage (dev)' — a dev build named 'OpenMessage' can still win 'open -a OpenMessage'."
            exit 1
          fi

      - name: Verify RELEASE=1 restores the shippable identity
        run: |
          RELEASE=1 bash macos/build.sh >/dev/null
          plist=macos/build/OpenMessage.app/Contents/Info.plist
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")
          echo "Release build bundle id: $id, name: $name"
          if [ "$id" != "com.openmessage.app" ]; then
            echo "::error::RELEASE=1 build has bundle id '$id', expected com.openmessage.app."
            exit 1
          fi
          if [ "$name" != "OpenMessage" ]; then
            echo "::error::RELEASE=1 build has CFBundleName '$name', expected 'OpenMessage'."
            exit 1
          fi
          test -f macos/build/OpenMessage.dmg || {
            echo "::error::RELEASE=1 build did not emit macos/build/OpenMessage.dmg."
            exit 1
          }
          # The rebuild must also have cleared the dev DMG — a stale
          # OpenMessage-dev.dmg next to OpenMessage.dmg invites mixups.
          if [ -f macos/build/OpenMessage-dev.dmg ]; then
            echo "::error::Stale OpenMessage-dev.dmg survived the RELEASE=1 rebuild."
            exit 1
          fi
